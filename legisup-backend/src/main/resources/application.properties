spring.application.name=legisup-backend

# Conexão com o PostgreSQL rodando no Docker (localhost:5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/legisup_db
spring.datasource.username=legisup_user
spring.datasource.password=secretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true